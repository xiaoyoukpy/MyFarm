<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="我的农场 - 一款笔记本风格的农场经营模拟游戏">
  <title>我的农场 - My Farm</title>
  
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/notebook.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/menu.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="app">
    <div id="menu-screen" class="menu-screen">
      <div class="menu-container">
        <div class="menu-header">
          <div class="menu-title-icon">📓</div>
          <h1 class="menu-title">我的农场</h1>
          <p class="menu-subtitle">笔记本风格农场经营模拟游戏</p>
        </div>
        
        <div class="menu-content">
          <div class="menu-main-buttons" id="menu-main-buttons">
            <button class="btn btn-menu-main" id="btn-start-game">开始游戏</button>
            <button class="btn btn-menu-main" id="btn-continue-game">继续游戏</button>
            <button class="btn btn-menu-main btn-menu-exit" id="btn-exit-game">退出游戏</button>
          </div>
          
          <div id="menu-save-selection" class="hidden">
            <div class="menu-section">
              <h2 class="menu-section-title">选择存档</h2>
              <div id="save-slots" class="save-slots">
              </div>
              <button class="btn btn-back-menu" id="btn-back-to-menu">← 返回</button>
            </div>
          </div>
        </div>
        
        <div class="menu-footer">
          <p class="menu-tip">提示：游戏会自动保存进度</p>
        </div>
      </div>
    </div>

    <div id="game-screen" class="game-screen hidden">
      <div class="notebook notebook-game" id="notebook-farm">
        <div class="tape tape-top"></div>
        
        <header class="notebook-header">
          <div class="header-left">
            <button id="menu-button" class="btn btn-icon btn-menu-trigger" aria-label="返回主菜单">
              <span class="btn-icon-text">☰</span>
            </button>
            <button id="debug-button" class="btn btn-icon hidden" aria-label="调试工具">
              <span class="btn-icon-text">🛠</span>
            </button>
            <h1 class="notebook-title">我的农场</h1>
          </div>
          <div class="notebook-meta">
            <span id="day-display">第 1 天</span>
            <span>
              <span class="icon-gold"></span>
              <span id="gold-display">100</span>
            </span>
          </div>
        </header>
        
        <main class="notebook-body">
          <nav class="notebook-sidebar" id="farm-sidebar">
            <button class="nav-item active" data-tab="letters" aria-label="通讯">
              <span class="nav-item-label">
                <span class="nav-item-icon">📬</span>
                <span>通讯</span>
              </span>
              <span class="nav-badge" style="display: none;">0</span>
            </button>

            <button class="nav-item" data-tab="shop" aria-label="商店">
              <span class="nav-item-label">
                <span class="nav-item-icon">🛒</span>
                <span>商店</span>
              </span>
            </button>
            
            <button class="nav-item" data-tab="farm" aria-label="农场情况">
              <span class="nav-item-label">
                <span class="nav-item-icon">🌾</span>
                <span>农场情况</span>
              </span>
            </button>
            
            <button class="nav-item" data-tab="plans" aria-label="计划项目">
              <span class="nav-item-label">
                <span class="nav-item-icon">📋</span>
                <span>计划项目</span>
              </span>
            </button>
            
            <button class="nav-item" data-tab="ranch" aria-label="鸡舍">
              <span class="nav-item-label">
                <span class="nav-item-icon">🐔</span>
                <span>鸡舍</span>
              </span>
            </button>
            
            <button class="nav-item" data-tab="warehouse" aria-label="农场仓库">
              <span class="nav-item-label">
                <span class="nav-item-icon">📦</span>
                <span>仓库</span>
              </span>
            </button>
            
            <button class="nav-item" data-tab="collection" aria-label="图鉴">
              <span class="nav-item-label">
                <span class="nav-item-icon">📖</span>
                <span>图鉴</span>
              </span>
            </button>

            <button class="nav-item" data-tab="logs" aria-label="日志">
              <span class="nav-item-label">
                <span class="nav-item-icon">📊</span>
                <span>日志</span>
              </span>
            </button>
          </nav>
          
          <section class="notebook-content" id="farm-content">
            <div id="tab-letters" class="tab-content active">
            </div>

            <div id="tab-shop" class="tab-content">
            </div>

            <div id="tab-farm" class="tab-content">
            </div>
            
            <div id="tab-plans" class="tab-content">
            </div>
            
            <div id="tab-ranch" class="tab-content">
            </div>
            
            <div id="tab-warehouse" class="tab-content">
            </div>
            
            <div id="tab-collection" class="tab-content">
            </div>
            
            <div id="tab-logs" class="tab-content">
            </div>
          </section>
        </main>
        
        <footer class="notebook-footer">
          <button id="flip-button" class="btn btn-flip" aria-label="翻到下一页">
            📖 翻到下一页
          </button>
          <button id="reset-button" class="btn btn-sm btn-footer" aria-label="重置游戏">
            重置存档
          </button>
        </footer>

        <div class="page-corner"></div>
        <div class="stain stain-1"></div>
        <div class="stain stain-2"></div>
      </div>

      <div class="notebook notebook-town hidden" id="notebook-town">
        <div class="tape tape-top"></div>
        
        <header class="notebook-header">
          <div class="header-left">
            <button id="menu-button-town" class="btn btn-icon btn-menu-trigger" aria-label="返回主菜单">
              <span class="btn-icon-text">☰</span>
            </button>
            <h1 class="notebook-title">小镇</h1>
          </div>
          <div class="notebook-meta">
            <span id="day-display-town">第 1 天</span>
            <span>
              <span class="icon-gold"></span>
              <span id="gold-display-town">100</span>
            </span>
          </div>
        </header>
        
        <main class="notebook-body">
          <nav class="notebook-sidebar" id="town-sidebar">
            <button class="nav-item active" data-tab="workshop" aria-label="加工坊">
              <span class="nav-item-label">
                <span class="nav-item-icon">🏭</span>
                <span>加工坊</span>
              </span>
            </button>
            <button class="nav-item" data-tab="arcade" aria-label="娱乐厅">
              <span class="nav-item-label">
                <span class="nav-item-icon">🎡</span>
                <span>娱乐厅</span>
              </span>
            </button>
          </nav>
          
          <section class="notebook-content" id="town-content">
            <div id="tab-workshop" class="tab-content active">
            </div>
            <div id="tab-arcade" class="tab-content">
            </div>
          </section>
        </main>

        <footer class="notebook-footer">
          <button id="flip-button-town" class="btn btn-flip" aria-label="翻到下一页">
            📖 翻到下一页
          </button>
          <button id="reset-button-town" class="btn btn-sm btn-footer" aria-label="重置游戏">
            重置存档
          </button>
        </footer>
      </div>

      <button id="scene-toggle" class="scene-toggle pos-right">新区</button>

      <button id="sponsor-btn" class="sponsor-btn" aria-label="赞助">
        <span class="sponsor-icon">❤️</span>
        <span class="sponsor-text">赞助</span>
      </button>
    </div>

    <div id="new-area-overlay" class="overlay hidden">
      <div class="new-area-panel">
        <div class="new-area-head">
          <h2>🌄 神秘新区</h2>
          <button id="new-area-close" class="modal-close" aria-label="关闭">✕</button>
        </div>
        <div id="new-area-content" class="new-area-content"></div>
      </div>
    </div>

    <div id="sponsor-overlay" class="overlay hidden">
      <div class="sponsor-panel">
        <div class="sponsor-head">
          <h2>❤️ 赞助农场</h2>
          <button id="sponsor-close" class="modal-close" aria-label="关闭">✕</button>
        </div>
        <div id="sponsor-body" class="sponsor-body"></div>
      </div>
    </div>
  </div>
  
  <div id="modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title" class="modal-title"></h2>
        <button class="modal-close" aria-label="关闭">✕</button>
      </div>
      <div id="modal-content" class="modal-body">
      </div>
      <div id="modal-actions" class="modal-footer">
      </div>
    </div>
  </div>
  
  <div id="toast" class="toast">
    <span id="toast-message"></span>
  </div>
  
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
